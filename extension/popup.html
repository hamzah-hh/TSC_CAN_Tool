<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CAN</title>
<style>
 body{margin:0;width:300px;font:13px/1.45 system-ui,Segoe UI,Arial,sans-serif;color:#202124;background:#fff}
 .wrap{padding:14px 16px}
 .row{display:flex;align-items:center;justify-content:space-between}
 h1{font-size:16px;margin:0}
 h2{font-size:13px;margin:0 0 6px}
 .hint{margin:10px 0;color:#5f6368}
 .stats{color:#5f6368;font-size:12px;border-top:1px solid #e8eaed;padding-top:8px}
 .last{border-top:1px solid #e8eaed;margin-top:10px;padding-top:10px}
 .last dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
 .last dt{color:#5f6368}
 .last dd{margin:0;word-break:break-word}
 .yes{color:#188038;font-weight:600}
 .no{color:#c5221f;font-weight:600}
 .small{font-size:12px;color:#5f6368;margin:8px 0 0}
 .dbg{display:flex;align-items:center;gap:6px;font-size:12px;color:#5f6368;margin-top:10px}
 .sw{position:relative;width:40px;height:22px}
 .sw input{opacity:0;width:0;height:0}
 .sl{position:absolute;inset:0;background:#bdc1c6;border-radius:22px;cursor:pointer;transition:.15s}
 .sl:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
 input:checked+.sl{background:#1a73e8}
 input:checked+.sl:before{transform:translateX(18px)}
 input:focus-visible+.sl{outline:2px solid #1a73e8;outline-offset:2px}
</style></head><body><div class="wrap">
 <div class="row"><h1>CAN</h1>
  <label class="sw"><input type="checkbox" id="on" aria-label="Turn CAN on or off"><span class="sl"></span></label></div>
 <p class="hint" id="state">On</p>
 <div class="row"><strong>Auto-format</strong>
  <label class="sw"><input type="checkbox" id="fmt" aria-label="Turn auto-format on or off"><span class="sl"></span></label></div>
 <p class="hint">Space formats the word. Backspace undoes it.</p>
 <p class="hint">Tab = accept, Esc = dismiss, Ctrl+&rarr; = one word</p>
 <div class="last" id="lastSection">
  <h2>Last field</h2>
  <dl id="last"><dt>Status</dt><dd>No field yet.</dd></dl>
  <p class="small">If CAN does not work in a form: click in the notes box, then open this popup and send a screenshot of this section.</p>
 </div>
 <label class="dbg"><input type="checkbox" id="dbg"> Debug log (browser console)</label>
 <div class="stats" id="stats">Model: loading...</div>
</div><script src="popup.js"></script></body></html>
