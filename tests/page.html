<!doctype html><html><head><meta charset="utf-8"><title>t</title>
<style>body{font:14px Arial;margin:20px;position:relative}
#ta{width:320px;height:60px;font:15px/1.4 Georgia,serif;padding:8px;border:2px solid #888}
#ta2{width:260px;height:70px;font:14px monospace;padding:6px;border:1px solid #444;letter-spacing:.5px}
#in{width:300px;font-size:16px;padding:6px 10px;border:1px solid #888}
#rx{width:300px;font:13px Arial;padding:4px}
</style></head><body>
<h3>textarea</h3><textarea id="ta"></textarea>
<h3>textarea 2 (scrolls)</h3><textarea id="ta2"></textarea>
<h3>input</h3><input id="in">
<h3>react-like</h3><input id="rx" type="text">
<script>
window.log=[];window.rv='';
const rx=document.getElementById('rx');
rx.addEventListener('input',e=>{window.rv=e.target.value;log.push('rx-input:'+e.target.value)});
document.getElementById('in').addEventListener('input',e=>log.push('in-input'));
document.getElementById('ta').addEventListener('input',e=>log.push('ta-input'));
</script></body></html>
